{% extends "base.html" %}

{% block content %}

<div class="form-card">

    <h1>
        Create account
    </h1>

    <form id="registerForm">

        <label>
            Name

            <input
                name="name"
                required
            >

        </label>


        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >

        </label>


        <button class="btn">
            Register
        </button>

    </form>


    <p id="message"></p>

    <p>
        Already registered?

        <a href="/login">
            Login
        </a>
    </p>

</div>

{% endblock %}
