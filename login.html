{% extends "base.html" %}

{% block content %}

<div class="form-card">

    <h1>
        Welcome back
    </h1>

    <form id="loginForm">

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button class="btn">
            Login
        </button>

    </form>


    <p id="message"></p>

    <p>
        New here?
        <a href="/register">
            Create an account
        </a>
    </p>

</div>

{% endblock %}
